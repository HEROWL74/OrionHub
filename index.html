<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Orion Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Orion Hub</h1>
    
    <div style="background:#1a1d24; padding:12px; border-radius:8px;">
        <button onclick="selectOrionRoot()">Select Orion Root Folder</button>
        <span id="path" style="margin-left:12px; color:#9aa0aa;">Not Set</span>
    </div>

    <h2>Available Engine Versions</h2>
    <div id="versions" class="version-list"></div>

    <h2>Create New Project</h2>
    <div class="project-create">
        <input id="project-name" placeholder="Project Name" />
        <select id="engineSelect">
            <option value="">Select Engine</option>
        </select>
        <button id="createBtn">Create Project</button>
    </div>

    <h2>Your Projects</h2>
    <div id="projectList" class="project-list"></div>

    <script src="renderer.js"></script>
</body>
</html>
