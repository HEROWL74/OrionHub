name: Build Verification (CI)

on:
  push:
    branches:
      - 'develop'
      - 'feature/**'
  pull_request:
    branches:
      - 'develop'

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Electronのビルドキャッシュ (Electron本体のバイナリなど) を保存
      - name: Cache Electron Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Build Check (Dry Run)
        shell: bash
        run: |
          # 実際にパッケージングまで行い、エラーが出ないか確認
          # publish: never を指定して、Releaseへのアップロードを防ぐ
          npx electron-builder --win --dir -c.publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}